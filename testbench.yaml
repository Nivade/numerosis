laravel: '@testbench'

providers:
  # Without this the package's own commands are absent from `php artisan`:
  # composer's auto-discovery does not reach the Testbench console boot, so
  # numerosis:install, tenants:delete and the rest were all unreachable.
  - Nvade\Numerosis\NumerosisServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
