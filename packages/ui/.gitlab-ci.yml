# This file is the mirror's root pipeline, not part of the monorepo's: the
# split job copies packages/ui to nvade-packages/numerosis-ui, where this
# lands as .gitlab-ci.yml and publishes each tag the split carries across.
# Tests and analysis stay in the monorepo, which is the only place this
# package is developed.

publish:composer:
  stage: deploy
  image: curlimages/curl:latest
  timeout: 5m
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      curl --fail-with-body --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data tag="$CI_COMMIT_TAG" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/composer"
