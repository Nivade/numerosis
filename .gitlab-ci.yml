# Ported from .github/workflows/ when the canonical remote moved to GitLab.
# Four workflows became three jobs: run-tests and phpstan kept their coverage,
# fix-php-code-style-issues became a read-only Pint check (nothing pushes a
# "Fix styling" commit back), and update-changelog is gone because CHANGELOG.md
# is written by hand here.

stages:
  - test
  - publish

variables:
  COMPOSER_ALLOW_SUPERUSER: '1'
  COMPOSER_NO_INTERACTION: '1'
  # Core requires `nvade/numerosis-ui: self.version`, and CI checks out a
  # detached HEAD, where Composer cannot read a branch name and guesses
  # 1.0.0. The path repo under packages/* is always dev-main, so the two only
  # meet if the root version is stated.
  COMPOSER_ROOT_VERSION: dev-main
  GIT_DEPTH: '50'

.php:
  image: php:${PHP_VERSION}-cli
  variables:
    PHP_VERSION: '8.5'
    # Only what the images lack. dom, curl, mbstring, fileinfo, iconv, pdo and
    # pdo_sqlite are already in php:*-cli, and gd, imagick and soap were
    # generator boilerplate nothing here requires: each one compiles from
    # source on every job.
    PHP_EXTENSIONS: 'bcmath intl pcntl pdo_mysql pdo_pgsql sockets zip'
  before_script:
    - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions
    - install-php-extensions @composer $PHP_EXTENSIONS
    - composer config cache-dir "$CI_PROJECT_DIR/.composer-cache"
  cache:
    key:
      files:
        - composer.json
    paths:
      - .composer-cache/

# testbench.yaml pins DB_HOST to 127.0.0.1, and composer's post-autoload-dump
# boots the workbench through `package:purge-skeleton`, so every composer call
# that runs scripts needs a database on the loopback. A service container
# answers on its alias instead, so socat forwards the two ports rather than
# every hardcoded host in the tree learning a second spelling.
.forwards-databases:
  before_script:
    - !reference [.php, before_script]
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends socat
    - socat TCP-LISTEN:3306,fork,reuseaddr TCP:mysql:3306 &
    - socat TCP-LISTEN:5432,fork,reuseaddr TCP:pgsql:5432 &
    - |
      until php -r 'exit(@fsockopen("127.0.0.1", 3306) ? 0 : 1);'; do
        sleep 2
      done

test:
  extends: [.php, .forwards-databases]
  stage: test
  timeout: 30m
  # tests/TestCase.php holds both sets of credentials, matching
  # docker-compose.yml's local services so the same suite runs unmodified in
  # both places. Both services start for every job; the driver the job
  # exercises is NUMEROSIS_TEST_DRIVER's job.
  # Durability off, in a container thrown away at the end of the job. The
  # suite creates a database and migrates it per tenant, and fsyncing each of
  # those put the mysql jobs at 29 minutes against pgsql's 5.
  services:
    - name: mysql:8.4
      alias: mysql
      command:
        - '--innodb-flush-log-at-trx-commit=0'
        - '--innodb-doublewrite=0'
        - '--sync-binlog=0'
        - '--skip-log-bin'
        - '--performance-schema=OFF'
    - name: postgres:17
      alias: pgsql
      command:
        - 'postgres'
        - '-c'
        - 'fsync=off'
        - '-c'
        - 'synchronous_commit=off'
        - '-c'
        - 'full_page_writes=off'
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: testing
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: testing
  # Matches what composer.json claims to support. Widen only with a green run
  # behind it: Laravel 11/12 and Windows were in the generator's matrix and
  # nothing here has ever been tested on them. SQLite is supported for
  # development rather than at production scale, so it gets one job rather than
  # a column.
  parallel:
    matrix:
      - PHP_VERSION: ['8.5', '8.4']
        NUMEROSIS_TEST_DRIVER: [mysql, pgsql]
      - PHP_VERSION: '8.5'
        NUMEROSIS_TEST_DRIVER: sqlite
  script:
    - composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-update
    - composer update --prefer-stable --prefer-dist
    - composer show -D
    # Not optional, and not only for the Browser suite: once
    # pestphp/pest-plugin-browser is installed its own Plugin::terminate()
    # starts the Playwright server on every Pest run, so a run without these
    # aborts with no test output at all. See tests/Browser/README.md.
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y --no-install-recommends nodejs
    - npm ci
    - npx playwright install --with-deps chromium
    # SQLite runs serially. `--parallel` puts eight processes on one directory
    # of database files, which is what SQLite is worst at: the run fails
    # somewhere different each time (SQLITE_BUSY, `attempt to write a readonly
    # database`, a half-copied template) rather than failing consistently. The
    # serial run covers the same tests.
    - |
      if [ "$NUMEROSIS_TEST_DRIVER" = "sqlite" ]; then
        vendor/bin/pest --ci
      else
        vendor/bin/pest --ci --parallel
      fi

# The analysis needs a database for the same reason the tests do: composer's
# post-autoload-dump boots the workbench.
phpstan:
  extends: [.php, .forwards-databases]
  stage: test
  timeout: 10m
  services:
    - name: mysql:8.4
      alias: mysql
      command:
        - '--innodb-flush-log-at-trx-commit=0'
        - '--skip-log-bin'
        - '--performance-schema=OFF'
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: testing
  script:
    - composer update --prefer-stable --prefer-dist
    - php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress

pint:
  extends: .php
  stage: test
  timeout: 10m
  script:
    # --no-scripts keeps the workbench unbooted: Pint reads files, and booting
    # it is what would need a database here.
    - composer update --prefer-stable --prefer-dist --no-scripts
    - vendor/bin/pint --test

# A tag in the Composer registry is what `"nvade/numerosis": "^0.2"` resolves
# to; pushing the git tag alone leaves the registry empty. GitLab reads
# composer.json out of the tag itself, so there is nothing to build first.
publish:composer:
  stage: publish
  image: curlimages/curl:latest
  timeout: 5m
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      curl --fail-with-body --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data tag="$CI_COMMIT_TAG" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/composer"

# packages/ui is published as a read-only mirror; this pushes it there. `main`
# keeps the mirror's default branch current for anyone tracking `@dev`, and a
# tag push copies the tag across, which is what Composer resolves. Pushes over
# SSH with SPLIT_SSH_KEY, a file variable holding the private half of a deploy
# key on the mirror with `can_push`. A deploy token cannot do this: the scope
# list has no write_repository in it.
split:ui:
  stage: publish
  image: alpine/git:latest
  timeout: 10m
  variables:
    # git subtree replays the whole history into the mirror; the default
    # shallow fetch produces a mirror with one commit and no error.
    GIT_DEPTH: '0'
    PACKAGE_DIRECTORY: packages/ui
    MIRROR: numerosis-ui
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - install -m 600 "$SPLIT_SSH_KEY" ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 gitlab.com >> ~/.ssh/known_hosts
  script:
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
    - SPLIT_SHA=$(git subtree split --prefix="$PACKAGE_DIRECTORY")
    - REMOTE="git@gitlab.com:nvade-packages/${MIRROR}.git"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git tag -f "$CI_COMMIT_TAG" "$SPLIT_SHA"
        git push --force "$REMOTE" "refs/tags/$CI_COMMIT_TAG"
      else
        git push --force "$REMOTE" "$SPLIT_SHA:refs/heads/main"
      fi
