services:
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-root}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-testing}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'numerosis-mysql:/var/lib/mysql'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-proot']
            retries: 3
            timeout: 5s

volumes:
    numerosis-mysql:
        driver: local
