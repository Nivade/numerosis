name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - '**/composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - '**/composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    services:
      # tests/TestCase.php hardcodes both sets of credentials, matching
      # docker-compose.yml's local dev services so the same suite runs
      # unmodified in both places. Both services start for every job; the
      # driver the job exercises is NUMEROSIS_TEST_DRIVER's job.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      pgsql:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: true
      # Matrix matches what composer.json actually claims to support.
      # Widen only with a green run behind it — Laravel 11/12 and Windows were
      # in the generator's matrix but nothing here has ever been tested on them.
      matrix:
        os: [ubuntu-latest]
        php: [8.5, 8.4]
        laravel: [13.*]
        database: [mysql, pgsql]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          # SQLite is supported for development rather than at production
          # scale, so it gets one job on one PHP version rather than a
          # column in the matrix above.
          - os: ubuntu-latest
            php: 8.5
            laravel: 13.*
            database: sqlite
            stability: prefer-stable
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.database }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, pdo_pgsql, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          ini-values: memory_limit=1G
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      # Not optional, and not only for the Browser suite: once
      # pestphp/pest-plugin-browser is installed its own Plugin::terminate()
      # starts the Playwright server on every Pest run, so a run without these
      # aborts with no test output at all. See tests/Browser/README.md.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # SQLite runs serially. `--parallel` puts eight processes on one
      # directory of database files, which is what SQLite is worst at: the
      # run fails somewhere different each time (SQLITE_BUSY, `attempt to
      # write a readonly database`, a half-copied template) rather than
      # failing consistently. The serial run covers the same tests.
      - name: Execute tests
        env:
          NUMEROSIS_TEST_DRIVER: ${{ matrix.database }}
        run: vendor/bin/pest --ci ${{ matrix.database == 'sqlite' && '' || '--parallel' }}

      # One PHP version and one driver — neither the analysis nor its
      # baseline varies by either.
      - name: Static analysis
        if: matrix.php == '8.5' && matrix.database == 'mysql'
        run: php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress
