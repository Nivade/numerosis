name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - '**/composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - '**/composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    services:
      # tests/TestCase.php hardcodes 127.0.0.1:3306, root/root, database
      # `testing` — matches docker-compose.yml's local dev service so the
      # same suite runs unmodified in both places. Tenant provisioning
      # needs CREATE DATABASE, which sqlite cannot provide.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: true
      # Matrix matches what composer.json actually claims to support.
      # Widen only with a green run behind it — Laravel 11/12 and Windows were
      # in the generator's matrix but nothing here has ever been tested on them.
      matrix:
        os: [ubuntu-latest]
        php: [8.5, 8.4]
        laravel: [13.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          ini-values: memory_limit=1G
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      # Not optional, and not only for the Browser suite: once
      # pestphp/pest-plugin-browser is installed its own Plugin::terminate()
      # starts the Playwright server on every Pest run, so a run without these
      # aborts with no test output at all. See tests/Browser/README.md.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute tests
        run: vendor/bin/pest --ci --parallel

      # One PHP version only — the analysis does not vary by PHP patch.
      - name: Static analysis
        if: matrix.php == '8.5'
        run: php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress
