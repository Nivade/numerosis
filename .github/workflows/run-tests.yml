name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    services:
      # tests/TestCase.php hardcodes 127.0.0.1:3306, root/root, database
      # `testing` — matches docker-compose.yml's local dev service so the
      # same suite runs unmodified in both places. Tenant provisioning
      # needs CREATE DATABASE, which sqlite cannot provide.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: true
      # Matrix matches what composer.json actually claims to support.
      # Widen only with a green run behind it — Laravel 11/12 and Windows were
      # in the generator's matrix but nothing here has ever been tested on them.
      matrix:
        os: [ubuntu-latest]
        php: [8.5, 8.4]
        laravel: [13.*]
        stability: [prefer-stable]
        # Two legs: stable v3 (what every ordinary host resolves to) and
        # dev-master (v4 — reachable only by a host that opts into
        # minimum-stability: dev, see .claude/rules/stancl-tenancy-v4.md).
        # dev-master needs stancl/jobpipeline:2.0.0-rc7 too — it's a hard
        # require of dev-master itself, not this package's choice.
        stancl: ['^3.10', 'dev-master']
        include:
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - stancl:${{ matrix.stancl }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          ini-values: memory_limit=1G
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies (stancl/tenancy stable leg)
        if: matrix.stancl != 'dev-master'
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "stancl/tenancy:${{ matrix.stancl }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Install dependencies (stancl/tenancy dev-master leg)
        if: matrix.stancl == 'dev-master'
        run: |
          composer config minimum-stability dev
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "stancl/tenancy:dev-master" "stancl/jobpipeline:2.0.0-rc7" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

      # Each leg analyses against its own config: the reflection stub for the
      # version that is NOT installed, plus its own baseline. `scanFiles`
      # stubs shadow real classes rather than merging with them, so loading
      # the wrong one makes correct code report as `method.notFound` — see
      # phpstan-common.neon. Runs once per stancl leg, on one PHP version
      # only, since the analysis does not vary by PHP patch.
      - name: Static analysis
        if: matrix.php == '8.5'
        run: |
          config=phpstan.neon.dist
          if [ "${{ matrix.stancl }}" = "dev-master" ]; then
            config=phpstan-dev-master.neon.dist
          fi
          php -d memory_limit=2G vendor/bin/phpstan analyse -c "$config" --no-progress
