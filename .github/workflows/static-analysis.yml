name: static-analysis

on:
  # Feature branches are covered by pull_request; without this filter a push
  # and its PR run the same commit twice.
  push:
    branches:
      - main
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - '.github/workflows/static-analysis.yml'
      - '**/composer.json'
  pull_request:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - '.github/workflows/static-analysis.yml'
      - '**/composer.json'
  # Dependencies resolve fresh on every run, so new upstream types can turn
  # level 9 red with no commit here.
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: '1'
  COMPOSER_ROOT_VERSION: dev-main

jobs:
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The analysis needs a database for the same reason the tests do:
    # composer's post-autoload-dump boots the workbench, and testbench.yaml
    # pins DB_HOST to 127.0.0.1.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, pcntl, pdo_mysql, pdo_pgsql, sockets, zip
          coverage: none

      # testbench.yaml names numerosis_workbench, and the service container
      # only creates the one MYSQL_DATABASE names.
      - name: Prepare the database
        run: |
          php -r '$c = new PDO("mysql:host=127.0.0.1;port=3306", "root", "root");
                  $c->exec("CREATE DATABASE IF NOT EXISTS numerosis_workbench");'

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-8.5-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.5-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist

      - name: Run PHPStan
        run: php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress --error-format=github
