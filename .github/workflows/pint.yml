name: pint

on:
  push:
    paths:
      - '**.php'
      - 'pint.json'
      - '.github/workflows/pint.yml'
  pull_request:
    paths:
      - '**.php'
      - 'pint.json'
      - '.github/workflows/pint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'
  COMPOSER_ROOT_VERSION: dev-main

jobs:
  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # --no-scripts keeps the workbench unbooted: Pint reads files, and
      # booting it is what would need a database here.
      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-scripts

      # Read-only. Nothing pushes a "Fix styling" commit back.
      - name: Check code style
        run: vendor/bin/pint --test
