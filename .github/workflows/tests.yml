name: tests

on:
  # Feature branches are covered by pull_request; without this filter a push
  # and its PR run the same commit twice.
  push:
    branches:
      - main
    paths:
      - '**.php'
      - '.github/workflows/tests.yml'
      - 'phpunit.xml.dist'
      - 'testbench.yaml'
      - '**/composer.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/tests.yml'
      - 'phpunit.xml.dist'
      - 'testbench.yaml'
      - '**/composer.json'
      - 'package.json'
      - 'package-lock.json'
  # composer.lock is gitignored and every job resolves fresh, so an upstream
  # release breaks main with no commit here to hang it on. Catch it on a
  # Monday rather than on whoever's branch pushes next.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: '1'
  # Core requires `nvade/numerosis-ui: self.version`, and CI checks out a
  # detached HEAD, where Composer cannot read a branch name and guesses 1.0.0.
  # The path repo under packages/* is always dev-main.
  COMPOSER_ROOT_VERSION: dev-main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # tests/TestCase.php hardcodes both sets of credentials, matching
    # docker-compose.yml so the same suite runs unmodified in both places.
    # Both services start for every job; NUMEROSIS_TEST_DRIVER picks one.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      pgsql:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      # One driver failing must not cancel the others, or a failure that is
      # really universal reads as driver-specific.
      fail-fast: false
      # Matches what composer.json claims to support. Widen only with a green
      # run behind it: Laravel 11/12 and Windows were in the generator's matrix
      # and nothing here has ever been tested on them.
      #
      # A pull request runs the newest PHP against MySQL alone, five billed
      # cells down to one; push to main and the weekly cron run the full grid.
      # Nothing is gated on these, so the grid catching a driver-specific
      # break after merge rather than before is the trade being made.
      matrix:
        php: ${{ github.event_name == 'pull_request' && fromJSON('["8.5"]') || fromJSON('["8.5", "8.4"]') }}
        database: ${{ github.event_name == 'pull_request' && fromJSON('["mysql"]') || fromJSON('["mysql", "pgsql", "sqlite"]') }}
        exclude:
          # SQLite is supported for development rather than at production
          # scale, so it gets one job rather than a column.
          - php: '8.4'
            database: sqlite

    name: P${{ matrix.php }} - ${{ matrix.database }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd, imagick and soap were generator boilerplate nothing here
          # requires; dom, curl, mbstring, fileinfo, iconv and pdo_sqlite ship
          # with the runner's PHP already.
          extensions: bcmath, intl, pcntl, pdo_mysql, pdo_pgsql, sockets, zip
          ini-values: memory_limit=1G
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # testbench.yaml names numerosis_workbench, and composer's
      # post-autoload-dump boots the workbench on every job including sqlite's.
      # Durability off too: the suite migrates a database per tenant, and
      # fsyncing each of those put the mysql jobs at 29 minutes against pgsql's 5.
      - name: Prepare the databases
        run: |
          php -r '$c = new PDO("mysql:host=127.0.0.1;port=3306", "root", "root");
                  $c->exec("CREATE DATABASE IF NOT EXISTS numerosis_workbench");
                  $c->exec("SET GLOBAL innodb_flush_log_at_trx_commit = 0");
                  $c->exec("SET GLOBAL sync_binlog = 0");'
          php -r '$c = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=testing", "postgres", "postgres");
                  foreach (["fsync", "synchronous_commit", "full_page_writes"] as $setting) {
                      $c->exec("ALTER SYSTEM SET {$setting} = off");
                  }
                  $c->exec("SELECT pg_reload_conf()");'

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-update
          composer update --prefer-stable --prefer-dist

      - name: List installed dependencies
        run: composer show -D

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Not optional, and not only for the Browser suite: once
      # pestphp/pest-plugin-browser is installed its own Plugin::terminate()
      # starts the Playwright server on every Pest run, so a run without these
      # aborts with no test output at all. See tests/Browser/README.md.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      # Split so a cache hit skips the browser download; the system libraries
      # are not cached and have to be installed either way.
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install-deps chromium
          npx playwright install chromium

      # SQLite runs serially. `--parallel` puts eight processes on one directory
      # of database files, which is what SQLite is worst at: the run fails
      # somewhere different each time (SQLITE_BUSY, `attempt to write a readonly
      # database`, a half-copied template) rather than failing consistently.
      - name: Execute tests
        env:
          NUMEROSIS_TEST_DRIVER: ${{ matrix.database }}
        run: vendor/bin/pest --ci ${{ matrix.database == 'sqlite' && '' || '--parallel' }}

      # A failed browser expectation points at this directory (Pest's
      # Support/Screenshot.php writes it), which otherwise dies with the runner.
      - name: Upload browser screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots-${{ matrix.php }}-${{ matrix.database }}
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
          retention-days: 7
