name: secret-scan

# No paths filter: a committed credential is not confined to one file type,
# and GitHub's own secret scanning needs Advanced Security on a private repo.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: gitleaks scans the commits in range, and a shallow fetch
      # silently narrows that to the tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GITLEAKS_LICENSE is required for organisation-owned repos only. This
      # one is owned by a user account, so the action runs unlicensed.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
